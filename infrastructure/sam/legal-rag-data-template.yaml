AWSTemplateFormatVersion: '2010-09-09'
Description: Private, versioned S3 storage for the legal RAG proof of concept.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Resources:
  LawDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/s3
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: EleKnowledge-AI
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClass
          Value: PublicLawSource

  LawDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LawDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt LawDataBucket.Arn
              - !Sub ${LawDataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  LawDataBucketName:
    Description: Dedicated bucket for law source data and derived KB documents.
    Value: !Ref LawDataBucket
  LawDataBucketArn:
    Description: ARN of the dedicated law data bucket.
    Value: !GetAtt LawDataBucket.Arn