version = 0.1

[default]
[default.global.parameters]
stack_name = "EleKnowledge-dev"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
tags = "Project=EleKnowledge Env=dev ManagedBy=SAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "eleknowledge-ai"
region = "ap-northeast-1"
image_repositories = []
disable_rollback = false
parameter_overrides = [
    "Environment=dev",
    "ProjectName=EleKnowledge"
]

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

[production]
[production.global.parameters]
stack_name = "EleKnowledge-prd"

[production.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
tags = "Project=EleKnowledge Env=prd ManagedBy=SAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "eleknowledge-ai"
region = "ap-northeast-1"
image_repositories = []
disable_rollback = false
parameter_overrides = [
    "Environment=prd",
    "ProjectName=EleKnowledge"
]
