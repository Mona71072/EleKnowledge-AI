AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: 'Phase 3 - Troubleshooting Agent Lambda Functions Only'

Parameters:
  Environment:
    Type: String
    Default: development
    Description: Environment name

Globals:
  Function:
    Runtime: python3.11
    Timeout: 60
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        AGENT_ID: PLACEHOLDER_AGENT_ID
        AGENT_ALIAS_ID: PLACEHOLDER_AGENT_ALIAS_ID
        KnowledgeBaseId: PLACEHOLDER_KB_ID
        SitesTableName: sites
        BEDROCK_REGION: us-east-1

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: troubleshooting-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                  - bedrock-agent-runtime:InvokeAgent
                  - bedrock:Retrieve
                  - bedrock-agent-runtime:Retrieve
                Resource: '*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt SitesTable.Arn

  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: constructionNumber
          AttributeType: S
      KeySchema:
        - AttributeName: constructionNumber
          KeyType: HASH

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: troubleshooting-orchestrator
      CodeUri: ../../lambda/troubleshooting/orchestrator/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

  DBSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: troubleshooting-db-search
      CodeUri: ../../lambda/troubleshooting/db-search/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

  KBSearch1Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: troubleshooting-kb-search1
      CodeUri: ../../lambda/troubleshooting/kb-search1/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

  KBSearch2Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: troubleshooting-kb-search2
      CodeUri: ../../lambda/troubleshooting/kb-search2/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

  KBSearch3Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: troubleshooting-kb-search3
      CodeUri: ../../lambda/troubleshooting/kb-search3/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

Outputs:
  OrchestratorFunctionArn:
    Value: !GetAtt OrchestratorFunction.Arn
  DBSearchFunctionArn:
    Value: !GetAtt DBSearchFunction.Arn
  KBSearch1FunctionArn:
    Value: !GetAtt KBSearch1Function.Arn
  KBSearch2FunctionArn:
    Value: !GetAtt KBSearch2Function.Arn
  KBSearch3FunctionArn:
    Value: !GetAtt KBSearch3Function.Arn
  SitesTableName:
    Value: !Ref SitesTable