version = 0.1

[default]
[default.deploy.parameters]
stack_name = "announcements-monitoring-dev"
template_file = "announcements-monitoring-template.yaml"
# Org SCP denies s3:PutBucketPublicAccessBlock, so resolve_s3 (managed-bucket
# creation) cannot be used. Point at the existing deployment artifacts bucket.
s3_bucket = "eleknowledge-sam-artifacts-dev-730972069979-ap-northeast-1"
s3_prefix = "announcements-monitoring"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
region = "ap-northeast-1"
confirm_changeset = true
disable_rollback = false
parameter_overrides = [
    "Environment=dev",
    "ProjectName=EleKnowledge",
    "AdminGroupName=admin",
]
