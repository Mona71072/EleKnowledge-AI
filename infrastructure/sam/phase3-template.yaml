AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: 'Phase 3 - Troubleshooting Agent Infrastructure'

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 512

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                  - dynamodb:Query
                  - ssm:GetParameter
                Resource: '*'

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: "troubleshooting-orchestrator-dev"
      Timeout: 60
      CodeUri: s3://eleknowledge-troubleshooting-deployment-20260205/orchestrator.zip
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

  DBSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: "troubleshooting-db-search-dev"
      Timeout: 60
      CodeUri: s3://eleknowledge-troubleshooting-deployment-20260205/db-search.zip
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

  KBSearch1Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: "troubleshooting-kb-search1-dev"
      Timeout: 60
      CodeUri: s3://eleknowledge-troubleshooting-deployment-20260205/kb-search1.zip
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

  TroubleshootingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: "dev"

Outputs:
  OrchestratorArn:
    Value: !GetAtt OrchestratorFunction.Arn