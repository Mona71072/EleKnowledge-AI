AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: 'Phase 3 - Troubleshooting Agent Full Stack (Lambda + DynamoDB + API Gateway)'

Parameters:
  CostProjectName:
    Type: String
    Default: ele-knowledge
    AllowedValues: [ele-knowledge]
  CostUsage:
    Type: String
    Default: development
    AllowedValues: [development, user, shared]

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prd
    Description: Environment name

  ProjectName:
    Type: String
    Default: EleKnowledge
    Description: Project name for resource tagging

  KnowledgeBaseId:
    Type: String
    Description: Bedrock Knowledge Base ID
    Default: pending

  TroubleCasesKnowledgeBaseId:
    Type: String
    Description: Bedrock Knowledge Base ID for trouble cases
    Default: pending

  TroubleshootingManualKnowledgeBaseId:
    Type: String
    Description: Bedrock Knowledge Base ID for troubleshooting manuals
    Default: pending

  CMaterialKnowledgeBaseId:
    Type: String
    Description: Bedrock Knowledge Base ID for C materials
    Default: pending

  DefaultControlSystem:
    Type: String
    Description: Temporary default control-system metadata filter
    Default: VFGLF

  AgentId:
    Type: String
    Description: Bedrock Agent ID
    Default: pending

  AgentAliasId:
    Type: String
    Description: Bedrock Agent Alias ID
    Default: pending

  BedrockRegion:
    Type: String
    Default: ap-northeast-1
    AllowedValues:
      - ap-northeast-1
    Description: AWS Region for Bedrock API calls

  AllowedIPList:
    Type: CommaDelimitedList
    Description: Office egress /32 CIDRs allowed to reach the API (same as GenU / WAF)
    Default: "203.178.81.200/32,210.172.233.198/32,210.172.233.219/32,210.172.233.220/32,192.218.140.236/32,192.218.140.237/32,192.218.140.238/32,192.218.140.239/32,192.218.140.240/32,192.218.140.241/32"

  PresignedUrlExpiresIn:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 43200
    Description: Citation presigned URL lifetime (seconds). Anyone holding the URL can fetch the document without auth, so keep it short.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        AGENT_ID: !Ref AgentId
        AGENT_ALIAS_ID: !Ref AgentAliasId
        KnowledgeBaseId: !Ref KnowledgeBaseId
        SitesTableName: !Ref SitesTable
        SESSIONS_TABLE: !Ref SessionsTable
        BEDROCK_REGION: !Ref BedrockRegion
        DEFAULT_CONTROL_SYSTEM: !Ref DefaultControlSystem
    Tags:
      gyoumu012Project: !Ref CostProjectName
      gyoumu012Component: troubleshooting
      gyoumu012Usage: !Ref CostUsage
      Project: !Ref ProjectName
      Env: !Ref Environment
      ManagedBy: SAM
      Phase: "3"

Resources:
  #
  # IAM
  #
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub troubleshooting-lambda-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                  - bedrock-agent-runtime:InvokeAgent
                  - bedrock:Retrieve
                  - bedrock-agent-runtime:Retrieve
                Resource: '*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt SitesTable.Arn
                  - !GetAtt SessionsTable.Arn
                  - !Sub ${SessionsTable.Arn}/index/*
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub
                    - arn:aws:s3:::${BucketName}
                    - BucketName:
                        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-DocumentsBucketName
                  - !Sub
                    - arn:aws:s3:::${BucketName}/*
                    - BucketName:
                        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-DocumentsBucketName
      Tags:
        - Key: gyoumu012Project
          Value: !Ref CostProjectName
        - Key: gyoumu012Component
          Value: troubleshooting
        - Key: gyoumu012Usage
          Value: !Ref CostUsage
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "3"

  #
  # DynamoDB
  #
  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sites-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: constructionNumber
          AttributeType: S
      KeySchema:
        - AttributeName: constructionNumber
          KeyType: HASH
      Tags:
        - Key: gyoumu012Project
          Value: !Ref CostProjectName
        - Key: gyoumu012Component
          Value: troubleshooting
        - Key: gyoumu012Usage
          Value: !Ref CostUsage
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "3"

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sessions-${Environment}
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-timestamp-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: gyoumu012Project
          Value: !Ref CostProjectName
        - Key: gyoumu012Component
          Value: troubleshooting
        - Key: gyoumu012Usage
          Value: !Ref CostUsage
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "3"

  #
  # Lambda Functions
  #
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
      FunctionName: !Sub orchestrator-${Environment}
      CodeUri: ../../lambda/troubleshooting/orchestrator/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          DOCUMENTS_BUCKET:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-DocumentsBucketName
          PRESIGNED_URL_EXPIRES_IN: !Ref PresignedUrlExpiresIn
      Events:
        AnalyzeApi:
          Type: Api
          Properties:
            RestApiId: !Ref TroubleshootingApi
            Path: /troubleshooting/analyze
            Method: post

  DBSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
      FunctionName: !Sub db-search-${Environment}
      CodeUri: ../../lambda/troubleshooting/db-search/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

  KBSearch1Function:
    Type: AWS::Serverless::Function
    Properties:
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
      FunctionName: !Sub kb-search-cases-${Environment}
      CodeUri: ../../lambda/troubleshooting/kb-search1/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          KnowledgeBaseId: !Ref TroubleCasesKnowledgeBaseId

  KBSearch2Function:
    Type: AWS::Serverless::Function
    Properties:
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
      FunctionName: !Sub kb-search-manuals-${Environment}
      CodeUri: ../../lambda/troubleshooting/kb-search2/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          KnowledgeBaseId: !Ref TroubleshootingManualKnowledgeBaseId

  KBSearch3Function:
    Type: AWS::Serverless::Function
    Properties:
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
      FunctionName: !Sub kb-search-materials-${Environment}
      CodeUri: ../../lambda/troubleshooting/kb-search3/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          KnowledgeBaseId: !Ref CMaterialKnowledgeBaseId

  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
      FunctionName: !Sub history-${Environment}
      CodeUri: ../../lambda/troubleshooting/history/
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 256
      Events:
        HistoryApi:
          Type: Api
          Properties:
            RestApiId: !Ref TroubleshootingApi
            Path: /troubleshooting/history
            Method: get

  AgentIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /eleknowledge/${Environment}/agent-id
      Type: String
      Value: !Ref AgentId
      Description: Bedrock Agent ID for troubleshooting
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
        Project: !Ref ProjectName
        Env: !Ref Environment
        ManagedBy: SAM
        Phase: "3"

  AgentAliasIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /eleknowledge/${Environment}/agent-alias-id
      Type: String
      Value: !Ref AgentAliasId
      Description: Bedrock Agent Alias ID for troubleshooting
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
        Project: !Ref ProjectName
        Env: !Ref Environment
        ManagedBy: SAM
        Phase: "3"

  #
  # API Gateway
  #
  TroubleshootingApi:
    Type: AWS::Serverless::Api
    Properties:
      PropagateTags: true
      Tags:
        gyoumu012Project: !Ref CostProjectName
        gyoumu012Component: troubleshooting
        gyoumu012Usage: !Ref CostUsage
      Name: !Sub troubleshooting-api-${Environment}
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CognitoUserPoolArn
        ResourcePolicy:
          IpRangeWhitelist: !Ref AllowedIPList
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseTemplates:
            application/json: '{"error": "Authentication required"}'
        ACCESS_DENIED:
          StatusCode: 403
          ResponseTemplates:
            application/json: '{"error": "Access denied"}'

Outputs:
  TroubleshootingApiUrl:
    Description: Troubleshooting API base URL for frontend requests
    Value: !Sub https://${TroubleshootingApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/troubleshooting
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  OrchestratorFunctionArn:
    Value: !GetAtt OrchestratorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-OrchestratorArn

  DBSearchFunctionArn:
    Value: !GetAtt DBSearchFunction.Arn

  KBSearch1FunctionArn:
    Value: !GetAtt KBSearch1Function.Arn

  KBSearch2FunctionArn:
    Value: !GetAtt KBSearch2Function.Arn

  KBSearch3FunctionArn:
    Value: !GetAtt KBSearch3Function.Arn

  HistoryFunctionArn:
    Value: !GetAtt HistoryFunction.Arn

  SitesTableName:
    Value: !Ref SitesTable
    Export:
      Name: !Sub ${AWS::StackName}-SitesTableName

  SessionsTableName:
    Value: !Ref SessionsTable
    Export:
      Name: !Sub ${AWS::StackName}-SessionsTableName

  AgentIdParameterName:
    Value: !Ref AgentIdParameter
    Export:
      Name: !Sub ${AWS::StackName}-AgentIdParameterName

  AgentAliasIdParameterName:
    Value: !Ref AgentAliasIdParameter
    Export:
      Name: !Sub ${AWS::StackName}-AgentAliasIdParameterName
