AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  EleKnowledge Phase 2: RAG Chat System
  Knowledge Base, RAG Lambda, Chat Management, OpenSearch Serverless

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prd
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: EleKnowledge
    Description: Project name
  
  AwsRegion:
    Type: String
    Default: ap-northeast-1
    AllowedValues:
      - ap-northeast-1
    Description: AWS Region (Bedrock availability required)
  
  Phase1StackName:
    Type: String
    Default: EleKnowledge-dev-phase1
    Description: Phase 1 CloudFormation stack name for importing values

  KnowledgeBaseId:
    Type: String
    Default: VQV81CNYU4
    AllowedPattern: '^[A-Z0-9]{10}$'
    Description: >-
      Existing Bedrock Knowledge Base ID to REUSE. This stack does NOT create it -
      it is owned by RagKnowledgeBaseStackINSTD and is used read-only.
      VQV81CNYU4 = generative-ai-use-cases-jpinstd (ADOPTED; matches the live
      rag-dev Lambda / EleKnowledge-dev-phase2 stack as verified 2026-08-26).
      Its s3-data-source KHPV3CNKOU indexes s3://ragknowledgebasestackinst-datasourcebucket9fa93e04-ybbhm1efhyzb/docs/
      (3,745 docs, standard TEXT parsing, last sync 2026-07-24 with the metadata
      refresh applied). It also has quick-start / web-crawler data sources that
      can inject unrelated GenU documents (filtered app-side).
      DF9XUCSPDM = generative-ai-use-cases-jp-inst-fmp (NOT adopted: MULTIMODAL
      parsing yields many IMAGE chunks without body text, and it has not been
      synced since 2026-06-03, missing the 2026-07-24 metadata refresh. Revisit
      only together with the app-side image-attachment rework).
      See docs/decisions-2026-08-26-kb-selection.md.

  LawKnowledgeBaseId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Z0-9]{10}$'
    Description: Optional dev-only Managed Knowledge Base for current e-Gov laws

  LawRagEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable law mode only when Environment is dev and a LawKnowledgeBaseId is configured

  LawDataBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: Optional existing dev law bucket for read-only full-text enrichment

  LawDataBucketKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+$'
    Description: 顧客管理キーを使うときだけ指定。AWS 管理キー（aws/s3）なら空でよい

  KnowledgeBaseDataSourceBucket:
    Type: String
    Default: ragknowledgebasestackinst-datasourcebucket9fa93e04-ybbhm1efhyzb
    Description: >-
      S3 bucket backing the reused Knowledge Base. Owned by an EXTERNAL stack.
      The RAG Lambda needs read access to it to presign citation links.

  KnowledgeBaseSourcePrefix:
    Type: String
    Default: docs/
    Description: Key prefix within KnowledgeBaseDataSourceBucket that holds the documents

  BedrockModelId:
    Type: String
    Default: jp.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Bedrock LLM Model ID. Must be an inference profile ID (jp.* / apac.* / global.*)
      or an application inference profile ARN (arn:aws:bedrock:...:application-inference-profile/xxx),
      not a bare foundation model ID. Request capabilities are selected by model_profile.py;
      unknown models use a minimal request unless MODEL_PROFILE_JSON supplies capabilities.

  BedrockRequestStyle:
    Type: String
    Default: auto
    AllowedValues:
      - auto
      - new
      - legacy
    Description: >-
      Deprecated compatibility fallback for models not recognized by model_profile.py.
      auto uses model_profile.py defaults; new uses a minimal request; legacy sends temperature.
      MODEL_PROFILE_JSON is recommended for explicit model capabilities.
  
  SessionTitleLlm:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Generate chat session titles with Claude (BedrockModelId) from the first question.
      Set to false to fall back to truncating the raw question (no extra Bedrock call).

  RagSearchType:
    Type: String
    Default: HYBRID
    AllowedValues:
      - HYBRID
      - SEMANTIC
    Description: >-
      Knowledge Base retrieve search type. HYBRID (vector + keyword) improves exact-term
      matching (model codes, error codes). SEMANTIC is vector-only. Wired to RAG_SEARCH_TYPE.

  KbProfileJson:
    Type: String
    Default: ''
    Description: Optional JSON overrides for the Knowledge Base metadata profile

  ModelProfileJson:
    Type: String
    Default: ''
    Description: Optional JSON overrides for model generation capabilities

  RerankModelArn:
    Type: String
    Default: ''
    Description: Optional Bedrock reranker model ARN. Empty disables post-retrieval reranking

  RerankMaxCandidates:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Maximum number of text chunks sent to the optional reranker

  QueryRewriteModelId:
    Type: String
    Default: ''
    Description: Optional Bedrock model ID for conversation-aware query rewriting

  GenerationThinking:
    Type: String
    Default: disabled
    AllowedValues:
      - disabled
      - adaptive
    Description: Thinking mode for normal responses on supported new API models

  GenerationEffort:
    Type: String
    Default: low
    AllowedValues:
      - low
      - medium
      - high
    Description: Adaptive thinking effort for normal responses on supported new API models

  RagLambdaTimeout:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 900
    Description: RAG Lambda function timeout (seconds)
  
  RagLambdaMemory:
    Type: Number
    Default: 1024
    AllowedValues:
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 3008
    Description: RAG Lambda function memory (MB)
  
  ChatLambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 300
    Description: Chat Management Lambda function timeout (seconds)
  
  ChatLambdaMemory:
    Type: Number
    Default: 512
    AllowedValues:
      - 128
      - 256
      - 512
      - 1024
    Description: Chat Management Lambda function memory (MB)
  
  RagApiThrottleBurst:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 10000
    Description: RAG API Gateway throttle burst limit
  
  RagApiThrottleRate:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10000
    Description: RAG API Gateway throttle rate limit
  
  ChatApiThrottleBurst:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 10000
    Description: Chat API Gateway throttle burst limit
  
  ChatApiThrottleRate:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10000
    Description: Chat API Gateway throttle rate limit
  
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 180
      - 365
    Description: CloudWatch Logs retention period (days)

  AllowedIPList:
    Type: CommaDelimitedList
    Description: Office egress /32 CIDRs allowed to reach the APIs (same as GenU / WAF)
    Default: "203.178.81.200/32,210.172.233.198/32,210.172.233.219/32,210.172.233.220/32,192.218.140.236/32,192.218.140.237/32,192.218.140.238/32,192.218.140.239/32,192.218.140.240/32,192.218.140.241/32"

  PresignedUrlExpiresIn:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 43200
    Description: >-
      Citation presigned URL lifetime (seconds). URLs are issued per click via
      GET /rag/document (PR #50), so only the minimum needed to open the
      document (5 min) is required. An issued URL is a bearer URL that cannot
      be revoked before expiry, so a short TTL minimizes the exposure window
      if it leaks.

  CitationUriMode:
    Type: String
    Default: presigned
    AllowedValues:
      - presigned
      - s3
    Description: >-
      Citation sourceUri format for staged rollout (PR #50). 'presigned'
      (default) keeps emitting presigned HTTPS URLs so the currently deployed
      frontend keeps working while GET /rag/document and /doc are rolled out
      first. Switch to 's3' only after the resolver is verified in the target
      environment and the new frontend is live on Amplify; from then on raw
      s3:// URIs are stored and resolved per click via GET /rag/document.

Conditions:
  HasRerankModelArn: !Not [!Equals [!Ref RerankModelArn, '']]
  LawRagDevEnabled: !And
    - !Equals [!Ref Environment, dev]
    - !Equals [!Ref LawRagEnabled, 'true']
    - !Not [!Equals [!Ref LawKnowledgeBaseId, '']]
  LawFullTextDevEnabled: !And
    - !Condition LawRagDevEnabled
    - !Not [!Equals [!Ref LawDataBucketName, '']]
  HasLawDataBucketKmsKey: !And
    - !Condition LawFullTextDevEnabled
    - !Not [!Equals [!Ref LawDataBucketKmsKeyArn, '']]

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
    Tags:
      Project: !Ref ProjectName
      Env: !Ref Environment
      ManagedBy: SAM
      Phase: "2"

Resources:
  # ============================================================================
  # Bedrock Knowledge Base (REUSED - not created by this stack)
  # ============================================================================
  # KnowledgeBaseId  KB
  #  (: RagKnowledgeBaseStackINSTD)
  #  KnowledgeBaseCollection / *EncryptionPolicy / *NetworkPolicy /
  # KnowledgeBaseRole  OpenSearch Serverless
  #  OCU
  KnowledgeBaseIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /eleknowledge/${Environment}/knowledge-base-id
      Type: String
      Value: !Ref KnowledgeBaseId
      Description: Bedrock Knowledge Base ID for EleKnowledge RAG
      Tags:
        Project: !Ref ProjectName
        Env: !Ref Environment
        ManagedBy: SAM
        Phase: "2"

  # ============================================================================
  # Lambda Execution Role (Phase 2)
  # ============================================================================
  RagLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rag-lambda-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              #  KB  ()
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
                  - !If
                    - LawRagDevEnabled
                    - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${LawKnowledgeBaseId}
                    - !Ref AWS::NoValue
              # jp.*  ARN
              # foundation-model ARN  AccessDeniedException
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*
                  # The Region wildcard also covers the regionless foundation-model ARN used by Global inference.
                  - !Sub arn:aws:bedrock:*::foundation-model/*
        - !If
          - HasRerankModelArn
          - PolicyName: RerankAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock:Rerank
                  Resource: '*'
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                  Resource: !Ref RerankModelArn
          - !Ref AWS::NoValue
        - PolicyName: InvokeSelfForSessionTitle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:rag-${Environment}
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ChatLogsTableArn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub
                    - arn:aws:s3:::${BucketName}/*
                    - BucketName:
                        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-DocumentsBucketName
              #  KB  ()
              #  URL  GetObject
              # PutObject  ( IAM )
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${KnowledgeBaseDataSourceBucket}/${KnowledgeBaseSourcePrefix}*
              - !If
                - LawFullTextDevEnabled
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::${LawDataBucketName}/kb/egov/*
                  Condition:
                    StringEquals:
                      aws:ResourceAccount: !Ref AWS::AccountId
                - !Ref AWS::NoValue
              - !If
                - HasLawDataBucketKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref LawDataBucketKmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue

  ChatLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub chat-lambda-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ChatLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ChatLogsTableArn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub
                    - ${TableArn}/index/userId-timestamp-index
                    - TableArn:
                        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ChatLogsTableArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "2"

  # ============================================================================
  # Lambda Functions - RAG
  # ============================================================================
  RagFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub rag-${Environment}
      CodeUri: ../../lambda/rag/rag-function/
      Handler: app.lambda_handler
      Description: RAG query processing with Knowledge Base and Claude 4
      Role: !GetAtt RagLambdaRole.Arn
      Timeout: !Ref RagLambdaTimeout
      MemorySize: !Ref RagLambdaMemory
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          LAW_KNOWLEDGE_BASE_ID: !Ref LawKnowledgeBaseId
          LAW_RAG_ENABLED: !Ref LawRagEnabled
          LAW_DATA_BUCKET_NAME: !If [LawFullTextDevEnabled, !Ref LawDataBucketName, '']
          LAW_DATA_BUCKET_OWNER: !If [LawFullTextDevEnabled, !Ref AWS::AccountId, '']
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REQUEST_STYLE: !Ref BedrockRequestStyle
          # 履歴一覧の見出し生成。既定は BEDROCK_MODEL_ID と同じモデル（追加の IAM 不要）
          SESSION_TITLE_LLM: !Ref SessionTitleLlm
          RAG_SEARCH_TYPE: !Ref RagSearchType
          KB_PROFILE_JSON: !Ref KbProfileJson
          MODEL_PROFILE_JSON: !Ref ModelProfileJson
          RERANK_MODEL_ARN: !Ref RerankModelArn
          RERANK_MAX_CANDIDATES: !Ref RerankMaxCandidates
          QUERY_REWRITE_MODEL_ID: !Ref QueryRewriteModelId
          GENERATION_THINKING: !Ref GenerationThinking
          GENERATION_EFFORT: !Ref GenerationEffort
          KB_SOURCE_BUCKET: !Ref KnowledgeBaseDataSourceBucket
          KB_SOURCE_PREFIX: !Ref KnowledgeBaseSourcePrefix
          CHATLOGS_TABLE:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ChatLogsTableName
          DOCUMENTS_BUCKET:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-DocumentsBucketName
          PRESIGNED_URL_EXPIRES_IN: !Ref PresignedUrlExpiresIn
          CITATION_URI_MODE: !Ref CitationUriMode
      Events:
        RagApi:
          Type: Api
          Properties:
            RestApiId: !Ref RagApi
            Path: /rag/query
            Method: POST
        # 引用文書の解決。Cognito Authorizer 通過（＝ログイン済み）のユーザーにだけ
        # 短命の署名付き URL を発行する。未ログインは 401 になり、フロントの
        # 中継ページがログイン画面へ誘導する。
        DocumentApi:
          Type: Api
          Properties:
            RestApiId: !Ref RagApi
            Path: /rag/document
            Method: GET

  ChatManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chat-${Environment}
      CodeUri: ../../lambda/chat/chat-management/
      Handler: app.lambda_handler
      Description: Chat session and message management
      Role: !GetAtt ChatLambdaRole.Arn
      Timeout: !Ref ChatLambdaTimeout
      MemorySize: !Ref ChatLambdaMemory
      Environment:
        Variables:
          CHATLOGS_TABLE:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ChatLogsTableName
          ENVIRONMENT: !Ref Environment
          FEEDBACK_METRIC_NAMESPACE: EleKnowledge/Feedback
          ADMIN_GROUP_NAME: admin
      Events:
        ListSessions:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/sessions
            Method: GET
        GetSession:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/sessions/{sessionId}
            Method: GET
        DeleteSession:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/sessions/{sessionId}
            Method: DELETE
        GetMessages:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/sessions/{sessionId}/messages
            Method: GET
        UpdateFeedback:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/messages/{messageId}/feedback
            Method: PUT
        ListAdminFailures:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/admin/failures
            Method: GET
        # 失敗・要望の振り分け（状態・原因・メモ・参照）。設計 docs/design-2026-09-10-dashboard-v2.md §9.4
        UpdateAdminTriage:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/admin/messages/{sessionId}/{messageId}/triage
            Method: PUT
        SubmitSuggestion:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/suggestions
            Method: POST
        ListAdminSuggestions:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApi
            Path: /chat/admin/suggestions
            Method: GET

  # ============================================================================
  # API Gateway
  # ============================================================================
  RagApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub rag-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
        MaxAge: "'3600'"
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CognitoUserPoolArn
        ResourcePolicy:
          IpRangeWhitelist: !Ref AllowedIPList
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      # アクセスログ（JSON 1 行/リクエスト）。requestId・時刻・resourcePath・status・latency・errorType 等を記録する。
      # IP / userAgent / sub / 実リクエスト path / errorMessage / 本文は記録しない（設計 docs/design-2026-09-10-dashboard-v2.md §4.3 I1）
      AccessLogSetting:
        DestinationArn: !GetAtt RagApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","extendedRequestId":"$context.extendedRequestId","requestTime":"$context.requestTime","requestTimeEpoch":"$context.requestTimeEpoch","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","integrationStatus":"$context.integrationStatus","errorType":"$context.error.responseType","wafResponseCode":"$context.wafResponseCode","xrayTraceId":"$context.xrayTraceId"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: !Ref RagApiThrottleBurst
          ThrottlingRateLimit: !Ref RagApiThrottleRate
          LoggingLevel: INFO
          # DataTrace はボディ全文を実行ログに書き出す。RAG API では利用者の質問文・
          # AI 回答全文・引用文書の署名付き URL がそのまま CloudWatch Logs に残るため false。
          DataTraceEnabled: false
          MetricsEnabled: true
      Tags:
        Project: !Ref ProjectName
        Env: !Ref Environment
        Phase: "2"
  
  ChatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub chat-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
        MaxAge: "'3600'"
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CognitoUserPoolArn
        ResourcePolicy:
          IpRangeWhitelist: !Ref AllowedIPList
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      # アクセスログ（JSON 1 行/リクエスト）。requestId・時刻・resourcePath・status・latency・errorType 等を記録する。
      # IP / userAgent / sub / 実リクエスト path / errorMessage / 本文は記録しない（設計 docs/design-2026-09-10-dashboard-v2.md §4.3 I1）
      AccessLogSetting:
        DestinationArn: !GetAtt ChatApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","extendedRequestId":"$context.extendedRequestId","requestTime":"$context.requestTime","requestTimeEpoch":"$context.requestTimeEpoch","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","integrationStatus":"$context.integrationStatus","errorType":"$context.error.responseType","wafResponseCode":"$context.wafResponseCode","xrayTraceId":"$context.xrayTraceId"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: !Ref ChatApiThrottleBurst
          ThrottlingRateLimit: !Ref ChatApiThrottleRate
          LoggingLevel: INFO
          # DataTrace はボディ全文を実行ログに書き出す。Chat API では会話履歴が
          # そのまま CloudWatch Logs に残るため false。
          DataTraceEnabled: false
          MetricsEnabled: true
      Tags:
        Project: !Ref ProjectName
        Env: !Ref Environment
        Phase: "2"

  # ============================================================================
  # CloudWatch Logs
  # ============================================================================
  RagApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/rag-api-${Environment}
      RetentionInDays: !Ref LogRetentionInDays
  
  ChatApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/chat-api-${Environment}
      RetentionInDays: !Ref LogRetentionInDays

Outputs:
  # API Gateway
  RagApiUrl:
    Description: RAG API Gateway URL
    Value: !Sub https://${RagApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${ProjectName}-${Environment}-RagApiUrl
  
  ChatApiUrl:
    Description: Chat Management API Gateway URL
    Value: !Sub https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ChatApiUrl
  
  # Lambda Functions
  RagFunctionArn:
    Description: RAG Lambda Function ARN
    Value: !GetAtt RagFunction.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-RagFunctionArn
  
  ChatManagementFunctionArn:
    Description: Chat Management Lambda Function ARN
    Value: !GetAtt ChatManagementFunction.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ChatManagementFunctionArn
  
  # NOTE: KnowledgeBaseCollectionArn / KnowledgeBaseCollectionEndpoint / KnowledgeBaseRoleArn
  # Phase 2  Knowledge Base

  KnowledgeBaseIdParameterName:
    Description: SSM parameter that stores the Bedrock Knowledge Base ID
    Value: !Ref KnowledgeBaseIdParameter
    Export:
      Name: !Sub ${ProjectName}-${Environment}-KnowledgeBaseIdParameterName
