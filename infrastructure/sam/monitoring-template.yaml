  # ------------------------------------------------------------------
  # Cognito のメール送信に関わるエラーを CloudTrail 経由で検知（issue #99、2026-09-10）
  # サインアップ・確認コード再送・パスワード再設定はブラウザから直接 Cognito を呼ぶため、
  # API Gateway / Lambda のアラームには掛からない。利用者起因のエラー（UsernameExists 等）は除外。
  # ------------------------------------------------------------------
  CognitoEmailErrorRule:
    Type: AWS::Events::Rule
    Properties:
      Tags:
        - Key: gyoumu012Project
          Value: !Ref CostProjectName
        - Key: gyoumu012Component
          Value: monitoring
        - Key: gyoumu012Usage
          Value: !Ref CostUsage
      Name: !Sub ${ProjectName}-${Environment}-cognito-email-errors
      Description: Cognito SignUp / ResendConfirmationCode / ForgotPassword failed with a quota or delivery error (CloudTrail)
      State: ENABLED
      EventPattern:
        source: [aws.cognito-idp]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [cognito-idp.amazonaws.com]
          eventName: [SignUp, ResendConfirmationCode, ForgotPassword, AdminCreateUser, AdminResetUserPassword]
          errorCode: !Ref CognitoAlertErrorCodes
      Targets:
        - Id: AlertTopic
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              api: $.detail.eventName
              code: $.detail.errorCode
              msg: $.detail.errorMessage
              time: $.detail.eventTime
            # InputTemplate は 1 行の JSON 文字列でなければならない（改行は \n エスケープ）
            InputTemplate: '"[P1] Cognito メール送信エラー: <api> が <code> で失敗しました（<time> UTC）。\n本文: <msg>\n対応: docs/ops-runbook.md §5.6。日次上限（Exceeded daily email limit）の場合、利用者には画面で翌日の手順が表示されます。登録受付の停止告知や事前発行（scripts/ops/provision_users.py）を検討してください。"'

  CognitoEmailErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Tags:
        - Key: gyoumu012Project
          Value: !Ref CostProjectName
        - Key: gyoumu012Component
          Value: monitoring
        - Key: gyoumu012Usage
          Value: !Ref CostUsage
      AlarmName: !Sub ${ProjectName}-${Environment}-P1-cognito-email-errors
      AlarmDescription: "A Cognito sign-up / resend / password-reset call failed with a quota or delivery error in the last 5 minutes (details in the EventBridge message). → 最初に見る場所: ランブック §5.6 / SNS 本文（API 名・エラーコード）"
      Namespace: AWS/Events
      MetricName: TriggeredRules
      Dimensions: [{ Name: RuleName, Value: !Ref CognitoEmailErrorRule }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ------------------------------------------------------------------
  # ログのメトリクスフィルタ（500 を return する関数のエラー行を拾う暫定検知）
  # ------------------------------------------------------------------
  RagErrorLinesFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /aws/lambda/${RagFunctionName}
      FilterPattern: '?Error ?error ?ERROR ?Exception ?exception ?Traceback ?ThrottlingException'
      MetricTransformations:
        - MetricNamespace: !Sub ${ProjectName}/Logs
          MetricName: RagErrorLines
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  ChatErrorLinesFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatFunctionName}
      FilterPattern: '?Error ?error ?ERROR ?Exception ?exception ?Traceback'
      MetricTransformations:
        - MetricNamespace: !Sub ${ProjectName}/Logs
          MetricName: ChatErrorLines
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  RagErrorLinesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Tags:
        - Key: gyoumu012Project
          Value: !Ref CostProjectName
        - Key: gyoumu012Component
          Value: monitoring
        - Key: gyoumu012Usage
          Value: !Ref CostUsage
      AlarmName: !Sub ${ProjectName}-${Environment}-P1-rag-error-lines
      AlarmDescription: "rag Lambda logged an error line (catches failures returned as HTTP 500) → 最初に見る場所: ランブック §2 / 保存クエリ rag-error-lines"
      Namespace: !Sub ${ProjectName}/Logs
      MetricName: RagErrorLines
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ChatErrorLinesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Tags:
        - Key: gyoumu012Project
          Value: !Ref CostProjectName
        - Key: gyoumu012Component
          Value: monitoring
        - Key: gyoumu012Usage
          Value: !Ref CostUsage
      AlarmName: !Sub ${ProjectName}-${Environment}-P1-chat-error-lines
      AlarmDescription: "chat Lambda logged an error line → 最初に見る場所: ランブック §2 / 保存クエリ chat-error-lines"
      Namespace: !Sub ${ProjectName}/Logs
      MetricName: ChatErrorLines
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ------------------------------------------------------------------
  # Logs Insights 保存クエリ（ランブックから名前で参照）
  # ------------------------------------------------------------------
  QueryRagErrors:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/rag-error-lines
      LogGroupNames: [!Sub '/aws/lambda/${RagFunctionName}']
      QueryString: |
        fields @timestamp, @message
        | filter @message like /(?i)(error|exception|traceback)/
        | sort @timestamp desc
        | limit 100

  QueryChatErrors:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/chat-error-lines
      LogGroupNames: [!Sub '/aws/lambda/${ChatFunctionName}']
      QueryString: |
        fields @timestamp, @message
        | filter @message like /(?i)(error|exception|traceback)/
        | sort @timestamp desc
        | limit 100

  QueryRagSlowRequests:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/rag-slow-requests
      LogGroupNames: [!Sub '/aws/lambda/${RagFunctionName}']
      QueryString: |
        filter @type = "REPORT"
        | fields @timestamp, @requestId, @duration, @maxMemoryUsed / 1024 / 1024 as memMB
        | sort @duration desc
        | limit 50

  # --- アクセスログ（API Gateway、JSON 1 行/リクエスト）用。設計 2026-09-10 dashboard v2 §4.3 I6 ---
  QueryApi4xxBreakdown:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/api-4xx-breakdown
      LogGroupNames:
        - !Sub '/aws/apigateway/rag-api-${Environment}'
        - !Sub '/aws/apigateway/chat-api-${Environment}'
        - !Sub '/aws/apigateway/auth-api-${Environment}'
      QueryString: |
        filter status >= 400 and status < 500
        | stats count() as n by errorType, status, resourcePath
        | sort n desc

  QueryRequestById:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/request-by-id
      LogGroupNames:
        - !Sub '/aws/apigateway/rag-api-${Environment}'
        - !Sub '/aws/apigateway/chat-api-${Environment}'
        - !Sub '/aws/apigateway/auth-api-${Environment}'
        - !Sub '/aws/lambda/${RagFunctionName}'
      QueryString: |
        # REPLACE_ME をアクセスログの requestId（= RAG Lambda の構造化行の requestId）に置き換える。
        # 移行期間: デプロイ前の Lambda 行は apiRequestId のみ。RAG Lambda のロググループ保持（365 日、scripts/ops/set_log_retention.py）を過ぎたら apiRequestId を外せる。
        fields @timestamp, @log, requestId, apiRequestId, status, statusCode, resourcePath, errorType, responseLatency, integrationLatency, latencyMs, event, stage, errorCode, exceptionClass
        | filter requestId = "REPLACE_ME" or apiRequestId = "REPLACE_ME"
        | sort @timestamp asc

  QuerySlowRequests:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/slow-requests
      LogGroupNames:
        - !Sub '/aws/apigateway/rag-api-${Environment}'
      QueryString: |
        fields @timestamp, resourcePath, status, responseLatency, integrationLatency, requestId
        | filter responseLatency > 20000
        | sort responseLatency desc
        | limit 50

  # ------------------------------------------------------------------
  # 予算アラート（AWS Budgets）。Bedrock のモデル行 1 本だけ。通知は同じ SNS へ（設計 §5.7）
  # アカウント全体の予算は置かない（他システムの Sonnet 4.6 と OpenSearch が支配的で、この 2 人が動ける情報にならない）
  # ------------------------------------------------------------------
  BedrockBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-${Environment}-P2-budget-bedrock
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetAmountUsd
          Unit: USD
        CostFilters:
          Service:
            - !Ref BudgetServiceName
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AlertTopicArn
