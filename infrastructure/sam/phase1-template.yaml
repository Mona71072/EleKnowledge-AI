AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  EleKnowledge Phase 1: Infrastructure Setup
  Authentication System, DynamoDB, S3, Lambda, API Gateway

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prd
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: EleKnowledge
    Description: Project name for resource tagging
  
  AwsRegion:
    Type: String
    Default: ap-northeast-1
    AllowedValues:
      - ap-northeast-1
    Description: AWS Region
  
  AllowedIPCIDR:
    Type: String
    Default: 192.168.28.0/24
    Description: Allowed IP CIDR for access
  
  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 300
    Description: Lambda function timeout (seconds)
  
  LambdaMemory:
    Type: Number
    Default: 512
    AllowedValues:
      - 128
      - 256
      - 512
      - 1024
      - 2048
    Description: Lambda function memory (MB)
  
  AuthApiThrottleBurst:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 10000
    Description: Auth API Gateway throttle burst limit
  
  AuthApiThrottleRate:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10000
    Description: Auth API Gateway throttle rate limit
  
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 180
      - 365
    Description: CloudWatch Logs retention period (days)
  
  DynamoDBBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode
  
  ProvisionedReadCapacity:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 40000
    Description: DynamoDB provisioned read capacity (only for PROVISIONED mode)
  
  ProvisionedWriteCapacity:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 40000
    Description: DynamoDB provisioned write capacity (only for PROVISIONED mode)
  
  CognitoPasswordMinLength:
    Type: Number
    Default: 8
    MinValue: 6
    MaxValue: 99
    Description: Cognito password minimum length
  
  PointInTimeRecoveryEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable DynamoDB Point-in-Time Recovery

  AllowedIPList:
    Type: CommaDelimitedList
    Description: Office egress /32 CIDRs allowed to reach the auth API (same as GenU / WAF)
    Default: "203.178.81.200/32,210.172.233.198/32,210.172.233.219/32,210.172.233.220/32,192.218.140.236/32,192.218.140.237/32,192.218.140.238/32,192.218.140.239/32,192.218.140.240/32,192.218.140.241/32"

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_NAME: !Ref ProjectName
        COGNITO_USER_POOL_ID: !Ref CognitoUserPool
        COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
        DYNAMODB_USERS_TABLE: !Ref UsersTable
        DYNAMODB_CHATLOGS_TABLE: !Ref ChatLogsTable
    Tags:
      Project: !Ref ProjectName
      Env: !Ref Environment
      ManagedBy: SAM
      Phase: "1"

Resources:
  # ============================================================================
  # Cognito User Pool Configuration
  # ============================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub users-${Environment}
      LambdaConfig:
        PreSignUp: !GetAtt DomainGuardFunction.Arn
        PreAuthentication: !GetAtt DomainGuardFunction.Arn
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        Project: !Ref ProjectName
        Env: !Ref Environment
        ManagedBy: SAM
        Phase: "1"

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub users-${Environment}-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      # セッション有効期限は仕様（phase1-foundation.md セキュリティ要件）どおり24時間。
      # Access/Id トークンは短命のまま、リフレッシュトークン失効でログインが切れる。
      RefreshTokenValidity: 24
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: hours
        AccessToken: minutes
        IdToken: minutes
      ReadAttributes:
        - email
        - name
        - email_verified
      WriteAttributes:
        - email
        - name

  # ============================================================================
  # DynamoDB Table Definitions
  # ============================================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "1"

  ChatLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub chatlogs-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: messageId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: messageId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: userId-timestamp-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "1"

  # ============================================================================
  # Amazon S3 Bucket Configuration
  # ============================================================================
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub documents-${Environment}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: MoveToGlacierAfter30Days
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: GLACIER
          - Id: MoveToDeepArchiveAfter90Days
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: DEEP_ARCHIVE
      # PublicAccessBlockConfiguration is intentionally omitted: an account-level
      # Organizations SCP (p-c3c4qcoz) explicitly denies s3:PutBucketPublicAccessBlock
      # for every principal in this account. AWS blocks public access on all newly
      # created S3 buckets by default (since April 2023), so this is not a regression.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "1"

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub uploads-${Environment}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempFilesAfter1Day
            Status: Enabled
            ExpirationInDays: 1
            Prefix: tmp/
      # PublicAccessBlockConfiguration intentionally omitted; see DocumentsBucket comment above.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "1"

  # ============================================================================
  # AWS IAM Role Definitions
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub auth-lambda-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !Sub ${UsersTable.Arn}/index/*
                  - !GetAtt ChatLogsTable.Arn
                  - !Sub ${ChatLogsTable.Arn}/index/*
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:ListUsers
                Resource:
                  - !GetAtt CognitoUserPool.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocumentsBucket.Arn
                  - !Sub ${DocumentsBucket.Arn}/*
                  - !GetAtt UploadsBucket.Arn
                  - !Sub ${UploadsBucket.Arn}/*
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
        - Key: Phase
          Value: "1"

  # ============================================================================
  # Lambda Functions for Authentication
  # ============================================================================
  SignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub signup-${Environment}
      CodeUri: ../../lambda/auth/signup/
      Handler: app.lambda_handler
      Description: User signup function
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
          USERS_TABLE: !Ref UsersTable
      Events:
        SignupApi:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/signup
            Method: POST

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub login-${Environment}
      CodeUri: ../../lambda/auth/login/
      Handler: app.lambda_handler
      Description: User login function
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
          USERS_TABLE: !Ref UsersTable
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/login
            Method: POST

  VerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub verify-${Environment}
      CodeUri: ../../lambda/auth/verify/
      Handler: app.lambda_handler
      Description: Email verification function
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
      Events:
        VerifyApi:
          Type: Api
          Properties:
            RestApiId: !Ref AuthApi
            Path: /auth/verify
            Method: POST

  # ============================================================================
  # Amazon API Gateway Configuration
  # ============================================================================
  # Cognito email-domain allowlist (PreSignUp / PreAuthentication).
  # No explicit FunctionName so CloudFormation auto-names it, avoiding a clash
  # with the pre-existing out-of-band function during reconciliation.
  DomainGuardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../lambda/cognito-domain-guard/
      Handler: domain_guard.handler
      Runtime: python3.13
      Timeout: 10
      MemorySize: 128
      Description: Cognito PreSignUp/PreAuth email-domain allowlist meltec/mitsubishielectric
      # Override the Globals env vars that !Ref CognitoUserPool / Client, otherwise
      # this function would depend on the pool while the pool's LambdaConfig depends
      # on this function (circular dependency). This function reads none of them.
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: unused
          COGNITO_CLIENT_ID: unused

  DomainGuardInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DomainGuardFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  AuthApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub auth-api-${Environment}
      StageName: !Ref Environment
      Auth:
        ResourcePolicy:
          IpRangeWhitelist: !Ref AllowedIPList
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
        MaxAge: "'3600'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      # アクセスログ（JSON 1 行/リクエスト）。実行ログと違い、4xx の種別（errorType）・送信元 IP・利用者（sub）・
      # 体感レイテンシ（responseLatency）が 1 行で読める。本文は含まない（設計 docs/design-2026-09-10-dashboard-v2.md §4.3 I1）
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","extendedRequestId":"$context.extendedRequestId","requestTime":"$context.requestTime","requestTimeEpoch":"$context.requestTimeEpoch","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","path":"$context.path","status":"$context.status","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","integrationStatus":"$context.integrationStatus","ip":"$context.identity.sourceIp","userAgent":"$context.identity.userAgent","sub":"$context.authorizer.claims.sub","errorType":"$context.error.responseType","errorMessage":"$context.error.message","wafResponseCode":"$context.wafResponseCode","xrayTraceId":"$context.xrayTraceId"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 10
          LoggingLevel: INFO
          # DataTrace はリクエスト/レスポンスのボディ全文を実行ログに書き出す。
          # この API は /auth/login /auth/signup を持つため、
          # 有効にすると平文パスワードが CloudWatch Logs に残る。
          # 本番・開発を問わず常に false。
          DataTraceEnabled: false
          MetricsEnabled: true
      Tags:
        Project: !Ref ProjectName
        Env: !Ref Environment
        ManagedBy: SAM
        Phase: "1"

  # ============================================================================
  # AWS CloudWatch Logs Configuration
  # ============================================================================
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/auth-api-${Environment}
      RetentionInDays: 30

Outputs:
  # Cognito
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CognitoUserPoolId
  
  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CognitoUserPoolArn
  
  CognitoClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub ${ProjectName}-${Environment}-CognitoClientId

  # DynamoDB
  UsersTableName:
    Description: Users Table Name
    Value: !Ref UsersTable
    Export:
      Name: !Sub ${ProjectName}-${Environment}-UsersTableName
  
  UsersTableArn:
    Description: Users Table ARN
    Value: !GetAtt UsersTable.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-UsersTableArn
  
  ChatLogsTableName:
    Description: Chat Logs Table Name
    Value: !Ref ChatLogsTable
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ChatLogsTableName
  
  ChatLogsTableArn:
    Description: Chat Logs Table ARN
    Value: !GetAtt ChatLogsTable.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ChatLogsTableArn

  # S3
  DocumentsBucketName:
    Description: Documents Bucket Name
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub ${ProjectName}-${Environment}-DocumentsBucketName
  
  UploadsBucketName:
    Description: Uploads Bucket Name
    Value: !Ref UploadsBucket
    Export:
      Name: !Sub ${ProjectName}-${Environment}-UploadsBucketName

  # API Gateway
  AuthApiUrl:
    Description: Auth API Gateway URL
    Value: !Sub https://${AuthApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AuthApiUrl
  
  AuthApiId:
    Description: Auth API Gateway ID
    Value: !Ref AuthApi
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AuthApiId

  # Lambda
  SignupFunctionArn:
    Description: Signup Lambda Function ARN
    Value: !GetAtt SignupFunction.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-SignupFunctionArn
  
  LoginFunctionArn:
    Description: Login Lambda Function ARN
    Value: !GetAtt LoginFunction.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-LoginFunctionArn
  
  VerifyFunctionArn:
    Description: Verify Lambda Function ARN
    Value: !GetAtt VerifyFunction.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-VerifyFunctionArn
  
  # IAM
  LambdaExecutionRoleArn:
    Description: Lambda Execution Role ARN
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-LambdaExecutionRoleArn
