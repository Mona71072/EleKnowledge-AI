AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  EleKnowledge - Announcements & Operations Monitoring
  (Home announcements feed + admin publishing pipeline + auto-aggregated metrics dashboard).
  Additive stack; does not modify phase1/2/3 resources.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prd]
    Description: Environment name

  ProjectName:
    Type: String
    Default: EleKnowledge
    Description: Project name for resource tagging

  AdminGroupName:
    Type: String
    Default: admin
    Description: Cognito group name that grants admin privileges (server-side enforced)

  AmplifyAppId:
    Type: String
    Default: d9ngenggxas1k
    Description: Amplify Hosting app id (AWS/AmplifyHosting metrics). Empty to skip.

  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-5
    Description: Model id used by rag Lambda (AWS/Bedrock ModelId dimension). Keep in sync with phase2 BedrockModelId.

  BedrockCostServiceName:
    Type: String
    Default: Claude Sonnet 5 (Amazon Bedrock Edition)
    Description: Cost Explorer SERVICE name of the Bedrock model line (one line per model). Verify in Cost Explorer.

  BedrockUnitPriceJson:
    Type: String
    Default: '{"global.anthropic.claude-sonnet-5": {"inputPerMTok": 2.0, "outputPerMTok": 10.0}, "jp.anthropic.claude-haiku-4-5-20251001-v1:0": {"inputPerMTok": 1.1, "outputPerMTok": 5.5}}'
    Description: USD per million tokens by model id (JSON). Stored in SSM; the daily estimate is reconciled against Cost Explorer.

  BedrockBudgetUsd:
    Type: Number
    Default: 100
    Description: Monthly budget (USD) for the Bedrock model line, shown on the cost page. Keep equal to the AWS Budgets amount.

  CostExplorerEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Fetch actual cost from Cost Explorer daily (2 requests/day, 0.01 USD each). Set false if ce:GetCostAndUsage is denied by SCP.

  AllowedIPList:
    Type: CommaDelimitedList
    Description: Office egress /32 CIDRs allowed to reach the API (same as GenU / WAF)
    Default: "203.178.81.200/32,210.172.233.198/32,210.172.233.219/32,210.172.233.220/32,192.218.140.236/32,192.218.140.237/32,192.218.140.238/32,192.218.140.239/32,192.218.140.240/32,192.218.140.241/32"

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        ADMIN_GROUP_NAME: !Ref AdminGroupName
    Tags:
      Project: !Ref ProjectName
      Env: !Ref Environment
      ManagedBy: SAM
      Feature: announcements-monitoring

Resources:
  # ==========================================================================
  # DynamoDB
  # ==========================================================================
  AnnouncementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub announcements-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      AttributeDefinitions:
        - AttributeName: announcementId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: publishAt
          AttributeType: S
      KeySchema:
        - AttributeName: announcementId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-publishAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: publishAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Env, Value: !Ref Environment }
        - { Key: ManagedBy, Value: SAM }
        - { Key: Feature, Value: announcements-monitoring }

  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub metrics-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # 2026-09-09 itai 決定: 日次 KPI は前年比較に使うため自動削除しない（issue #86）
      TimeToLiveSpecification:
        Enabled: false
        AttributeName: ttl
      AttributeDefinitions:
        - AttributeName: metricDate
          AttributeType: S
        - AttributeName: scope
          AttributeType: S
      KeySchema:
        - AttributeName: metricDate
          KeyType: HASH
        - AttributeName: scope
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: scope-metricDate-index
          KeySchema:
            - AttributeName: scope
              KeyType: HASH
            - AttributeName: metricDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Env, Value: !Ref Environment }
        - { Key: ManagedBy, Value: SAM }
        - { Key: Feature, Value: announcements-monitoring }

  # Bedrock の単価表（USD / 100 万トークン）。推定 Bedrock 費の算出に使う。
  # 改定時はこのパラメータを変えて再デプロイする（コンソールで直接書き換えると次回デプロイで戻る）
  BedrockUnitPriceParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /eleknowledge/${Environment}/bedrock-unit-price
      Type: String
      Value: !Ref BedrockUnitPriceJson
      Description: USD per million tokens by Bedrock model id (JSON)
      Tags:
        Project: !Ref ProjectName
        Env: !Ref Environment
        ManagedBy: SAM

  # ==========================================================================
  # IAM Roles (least privilege, one per function)
  # ==========================================================================
  AnnouncementsReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub announcements-read-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: ReadAnnouncements
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource:
                  - !GetAtt AnnouncementsTable.Arn
                  - !Sub ${AnnouncementsTable.Arn}/index/*

  AnnouncementsWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub announcements-write-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: WriteAnnouncements
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan]
                Resource: !GetAtt AnnouncementsTable.Arn

  AnnouncementsPublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub announcements-publisher-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: PromoteScheduled
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt AnnouncementsTable.Arn
                  - !Sub ${AnnouncementsTable.Arn}/index/*

  MetricsReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub metrics-read-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: ReadMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource:
                  - !GetAtt MetricsTable.Arn
                  - !Sub ${MetricsTable.Arn}/index/*
                  # 表示中の告知（ダッシュボードの「いま」）
                  - !GetAtt AnnouncementsTable.Arn
                  - !Sub ${AnnouncementsTable.Arn}/index/*
              # 「いま」の値は表示のたびに CloudWatch を直接読む（設計 §2.2）
              - Effect: Allow
                Action: [cloudwatch:DescribeAlarms, cloudwatch:DescribeAlarmHistory, cloudwatch:GetMetricData]
                Resource: '*'

  MetricsAggregatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub metrics-aggregator-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: AggregateMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:Query]
                Resource:
                  - !Sub
                    - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
                    - TableName:
                        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ChatLogsTableName
                  - !Sub
                    - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*
                    - TableName:
                        Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ChatLogsTableName
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt MetricsTable.Arn
              - Effect: Allow
                Action: [cloudwatch:GetMetricStatistics, cloudwatch:GetMetricData, cloudwatch:DescribeAlarmHistory]
                Resource: '*'
              # 実額（Cost Explorer）。SCP で拒否される場合は CostExplorerEnabled=false にする（設計 §8.1）
              - Effect: Allow
                Action: [ce:GetCostAndUsage]
                Resource: '*'
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/eleknowledge/${Environment}/bedrock-unit-price

  # ==========================================================================
  # Lambda Functions
  # ==========================================================================
  AnnouncementsReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub announcements-read-${Environment}
      CodeUri: ../../lambda/announcements/read/
      Handler: app.lambda_handler
      Role: !GetAtt AnnouncementsReadRole.Arn
      Environment:
        Variables:
          ANNOUNCEMENTS_TABLE: !Ref AnnouncementsTable
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /announcements
            Method: GET

  AnnouncementsWriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub announcements-write-${Environment}
      CodeUri: ../../lambda/announcements/write/
      Handler: app.lambda_handler
      Role: !GetAtt AnnouncementsWriteRole.Arn
      Environment:
        Variables:
          ANNOUNCEMENTS_TABLE: !Ref AnnouncementsTable
      Events:
        ListAll:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /admin/announcements
            Method: GET
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /admin/announcements
            Method: POST
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /admin/announcements/{id}
            Method: PUT
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /admin/announcements/{id}
            Method: DELETE

  # Promote due scheduled announcements every 5 minutes (admin status accuracy).
  # Read Lambda also surfaces due scheduled items immediately without waiting for this job.
  AnnouncementsPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub announcements-publisher-${Environment}
      CodeUri: ../../lambda/announcements/publisher/
      Handler: app.lambda_handler
      Role: !GetAtt AnnouncementsPublisherRole.Arn
      Timeout: 60
      Environment:
        Variables:
          ANNOUNCEMENTS_TABLE: !Ref AnnouncementsTable
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: !Sub announcements-promote-${Environment}
            Description: Promote due scheduled announcements to published

  MetricsReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub metrics-read-${Environment}
      CodeUri: ../../lambda/metrics/read/
      Handler: app.lambda_handler
      Role: !GetAtt MetricsReadRole.Arn
      Environment:
        Variables:
          METRICS_TABLE: !Ref MetricsTable
          ANNOUNCEMENTS_TABLE: !Ref AnnouncementsTable
          API_NAMES: !Sub rag-api-${Environment},chat-api-${Environment},auth-api-${Environment},announcements-monitoring-api-${Environment}
          ALARM_PREFIX: !Sub ${ProjectName}-${Environment}-
          BEDROCK_COST_SERVICE_NAME: !Ref BedrockCostServiceName
          BEDROCK_BUDGET_USD: !Ref BedrockBudgetUsd
      Events:
        # 旧形式（現行 UI）。UI 切替後に削除する
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /admin/metrics
            Method: GET
        GetDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /admin/metrics/dashboard
            Method: GET
        GetCost:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /admin/metrics/cost
            Method: GET

  MetricsAggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub metrics-aggregator-${Environment}
      CodeUri: ../../lambda/metrics/aggregator/
      Handler: app.lambda_handler
      Role: !GetAtt MetricsAggregatorRole.Arn
      # 3 日分の再集計 × CloudWatch 呼び出し（API 4 本・Amplify・Cognito・Bedrock・アラーム履歴）+ Cost Explorer
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          METRICS_TABLE: !Ref MetricsTable
          # 日次確定時に D-1〜D-3 を再集計する（後付けの 👍👎・資料クリックを回答日の行へ反映）
          REAGGREGATE_DAYS: "3"
          CHATLOGS_TABLE:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-ChatLogsTableName
          RAG_FUNCTION_NAME: !Sub rag-${Environment}
          CHAT_FUNCTION_NAME: !Sub chat-${Environment}
          RAG_API_NAME: !Sub rag-api-${Environment}
          # 監視対象 API（順番: rag, chat, auth, app）
          API_NAMES: !Sub rag-api-${Environment},chat-api-${Environment},auth-api-${Environment},announcements-monitoring-api-${Environment}
          ALARM_PREFIX: !Sub ${ProjectName}-${Environment}-
          AMPLIFY_APP_ID: !Ref AmplifyAppId
          COGNITO_USER_POOL_ID:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CognitoUserPoolId
          COGNITO_CLIENT_ID:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CognitoClientId
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_COST_SERVICE_NAME: !Ref BedrockCostServiceName
          UNIT_PRICE_PARAM: !Ref BedrockUnitPriceParameter
          COST_EXPLORER_ENABLED: !Ref CostExplorerEnabled
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # 02:00 JST == 17:00 UTC. 前日（JST）を確定し、D-2・D-3 も再集計する
            Schedule: cron(0 17 * * ? *)
            Name: !Sub metrics-daily-agg-${Environment}
            Description: Daily metrics aggregation for EleKnowledge dashboard
            Input: '{"mode": "daily"}'
        HourlySchedule:
          Type: Schedule
          Properties:
            # 当日（JST）を partial=true で毎時上書きし、時間帯別の行も更新する
            Schedule: rate(1 hour)
            Name: !Sub metrics-hourly-agg-${Environment}
            Description: Hourly (partial) metrics aggregation for today
            Input: '{"mode": "hourly"}'

  # ==========================================================================
  # API Gateway (Cognito authorizer + office IP whitelist, mirrors phase2)
  # ==========================================================================
  AppApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub announcements-monitoring-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
        MaxAge: "'3600'"
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::ImportValue: !Sub ${ProjectName}-${Environment}-CognitoUserPoolArn
        # OPTIONS must succeed for browser CORS preflight (Authorization header).
        # Data methods remain office-IP whitelisted (same CIDRs as GenU / other stacks).
        ResourcePolicy:
          CustomStatements:
            - Effect: Allow
              Principal: '*'
              Action: execute-api:Invoke
              Resource: execute-api:/*/OPTIONS/*
            - Effect: Allow
              Principal: '*'
              Action: execute-api:Invoke
              Resource: execute-api:/*/*/*
              Condition:
                IpAddress:
                  aws:SourceIp: !Ref AllowedIPList
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          # DataTrace はボディ全文を実行ログに書き出すため false。
          DataTraceEnabled: false
          MetricsEnabled: true
      Tags:
        Project: !Ref ProjectName
        Env: !Ref Environment
        Feature: announcements-monitoring

Outputs:
  AppApiUrl:
    Description: Base URL for announcements & metrics API
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AppApiUrl

  AnnouncementsTableName:
    Value: !Ref AnnouncementsTable
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AnnouncementsTableName

  MetricsTableName:
    Value: !Ref MetricsTable
    Export:
      Name: !Sub ${ProjectName}-${Environment}-MetricsTableName
