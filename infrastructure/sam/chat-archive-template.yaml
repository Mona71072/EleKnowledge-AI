AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  EleKnowledge chat archive - streams chatlogs DynamoDB changes to S3 for
  long-term retention and Athena analysis. Reflects the resources created
  out-of-band on 2026-07-21 (Step 2 of the soft-delete / analytics work).

# ---------------------------------------------------------------------------
# NOTE: Deployed as CloudFormation stack `eleknowledge-chat-archive-dev`
# (UPDATE_COMPLETE, verified 2026-09-09). Earlier note about out-of-band
# creation is obsolete. Deploy with:
#   sam build --template chat-archive-template.yaml
#   sam deploy --stack-name eleknowledge-chat-archive-dev --s3-bucket <artifacts bucket> --no-resolve-s3 ...
# ---------------------------------------------------------------------------

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: EleKnowledge
  ChatLogsStreamArn:
    Type: String
    Description: LatestStreamArn of the chatlogs table (NEW_AND_OLD_IMAGES)
    Default: arn:aws:dynamodb:ap-northeast-1:730972069979:table/chatlogs-dev/stream/2026-07-01T09:17:54.718

Resources:

  ArchiveBucket:
    Type: AWS::S3::Bucket
    # PublicAccessBlock is enforced org-wide by SCP; do not set it here.
    Properties:
      BucketName: !Sub eleknowledge-chat-archive-${Environment}-${AWS::AccountId}
      # 永久保存の正本のため誤削除・上書きに備える（issue #86 P0）
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: transition-cold
            Status: Enabled
            Prefix: chatlogs/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 60
              - StorageClass: GLACIER
                TransitionInDays: 180
          - Id: transition-failed-invocations
            Status: Enabled
            Prefix: aws/lambda/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 60
              - StorageClass: GLACIER
                TransitionInDays: 180
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  ArchiveFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub eleknowledge-chat-archive-${Environment}-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ArchiveAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StreamRead
                Effect: Allow
                Action:
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:DescribeStream
                  - dynamodb:ListStreams
                Resource: !Ref ChatLogsStreamArn
              - Sid: S3Write
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${ArchiveBucket}/*
              - Sid: S3DestinationList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArchiveBucket.Arn

  ArchiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eleknowledge-chat-archive-${Environment}
      Runtime: python3.13
      Handler: app.handler
      CodeUri: ../../lambda/chat-archive/
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt ArchiveFunctionRole.Arn
      Tags:
        Project: !Ref ProjectName
        Env: !Ref Environment
        ManagedBy: SAM
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          ARCHIVE_PREFIX: chatlogs
      Events:
        ChatLogsStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref ChatLogsStreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 30
            MaximumRetryAttempts: 3
            # 3 回失敗したバッチは S3 OnFailure に呼出しレコード全体を残す（issue #86 P0）
            BisectBatchOnFunctionError: true
            DestinationConfig:
              OnFailure:
                Type: S3
                Destination: !GetAtt ArchiveBucket.Arn

  # 失敗宛先にメッセージが入ったら通知（監視スタックの SNS トピックを参照）
  ArchiveFailureEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub eleknowledge-chat-archive-${Environment}-failure-notification
      Description: Notify when Lambda writes a failed DynamoDB Streams invocation to the archive bucket.
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref ArchiveBucket]
          object:
            key:
              - prefix: aws/lambda/
      State: ENABLED
      Targets:
        - Arn:
            Fn::ImportValue: !Sub ${ProjectName}-${Environment}-AlertTopicArn
          Id: ArchiveFailureAlertTopic
      # SNS の TopicPolicy は監視スタックが持つ。ここで置き換えると CloudWatch 向けの許可が消える。
      # 監視スタックの AllowEventBridgeRules（rule/*）がこのルールの sns:Publish を許可する。

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub eleknowledge-athena-results-${Environment}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-query-results
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM

  AnalyticsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub eleknowledge-analytics-${Environment}
      Description: EleKnowledge chat analytics workgroup
      State: ENABLED
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: SAM
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub s3://${AthenaResultsBucket}/query-results/
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  AnalyticsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: eleknowledge_analytics
        Description: EleKnowledge chat analytics

  ChatLogsArchiveTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref AnalyticsDatabase
      TableInput:
        Name: chatlogs_archive
        TableType: EXTERNAL_TABLE
        PartitionKeys:
          - { Name: dt, Type: string }
        Parameters:
          classification: json
          projection.enabled: 'true'
          projection.dt.type: date
          projection.dt.range: 2026-07-01,NOW
          projection.dt.format: yyyy-MM-dd
          projection.dt.interval: '1'
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${ArchiveBucket}/chatlogs/dt=${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${ArchiveBucket}/chatlogs/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              case.insensitive: 'true'
              ignore.malformed.json: 'true'
          Columns:
            - { Name: eventname, Type: string }
            - { Name: eventid, Type: string }
            - { Name: approximatecreationdatetime, Type: double }
            - { Name: keys, Type: 'struct<sessionid:string,messageid:string>' }
            - { Name: newimage, Type: 'struct<sessionid:string,messageid:string,userid:string,timestamp:string,content:string,role:string,deleted:boolean,deletedat:string,ttl:bigint,feedback:string,responsetype:string,feedbackreason:string,queryfilters:struct<modeltype:string>>' }
            - { Name: oldimage, Type: 'struct<sessionid:string,messageid:string,userid:string,timestamp:string,content:string,role:string,deleted:boolean,deletedat:string,ttl:bigint,feedback:string,responsetype:string,feedbackreason:string,queryfilters:struct<modeltype:string>>' }
            - { Name: useridentity, Type: 'struct<principalid:string,type:string>' }

Outputs:
  ArchiveBucketName:
    Value: !Ref ArchiveBucket
  AthenaTable:
    Value: !Sub ${AnalyticsDatabase}.chatlogs_archive
  AthenaWorkGroup:
    Value: !Ref AnalyticsWorkGroup
  AthenaResultsBucket:
    Value: !Ref AthenaResultsBucket
