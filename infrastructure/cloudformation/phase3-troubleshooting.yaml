  # ==================== CloudWatch Log Groups ====================
  
  OrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/troubleshooting-orchestrator
      RetentionInDays: 30

  DBSearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/troubleshooting-db-search
      RetentionInDays: 30

  KBSearch1LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/troubleshooting-kb-search1
      RetentionInDays: 30

  KBSearch2LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/troubleshooting-kb-search2
      RetentionInDays: 30

  KBSearch3LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/troubleshooting-kb-search3
      RetentionInDays: 30

Outputs:
  OrchestratorFunctionArn:
    Value: !GetAtt OrchestratorFunction.Arn
    Export:
      Name: troubleshooting-orchestrator-arn

  DBSearchFunctionArn:
    Value: !GetAtt DBSearchFunction.Arn
    Export:
      Name: troubleshooting-db-search-arn

  KBSearch1FunctionArn:
    Value: !GetAtt KBSearch1Function.Arn
    Export:
      Name: troubleshooting-kb-search1-arn

  KBSearch2FunctionArn:
    Value: !GetAtt KBSearch2Function.Arn
    Export:
      Name: troubleshooting-kb-search2-arn

  KBSearch3FunctionArn:
    Value: !GetAtt KBSearch3Function.Arn
    Export:
      Name: troubleshooting-kb-search3-arn

  SitesTableName:
    Value: !Ref SitesTable
    Export:
      Name: troubleshooting-sites-table-name

  SitesTableArn:
    Value: !GetAtt SitesTable.Arn
    Export:
      Name: troubleshooting-sites-table-arn