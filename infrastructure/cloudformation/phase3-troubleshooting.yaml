AWSTemplateFormatVersion: '2010-09-09'

Description: 'Phase 3 - Troubleshooting Agent Lambda Functions'

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name

Resources:
  # ==================== IAM Role ====================
  
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: troubleshooting-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                  - bedrock-agent-runtime:InvokeAgent
                  - bedrock:Retrieve
                  - bedrock-agent-runtime:Retrieve
                Resource: '*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt SitesTable.Arn

  # ==================== DynamoDB Table ====================
  
  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: constructionNumber
          AttributeType: S
      KeySchema:
        - AttributeName: constructionNumber
          KeyType: HASH

  # ==================== Orchestrator Lambda ====================
  
  OrchestratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: troubleshooting-orchestrator
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: app.lambda_handler
      Code:
        ZipFile: |
          import json
          import os
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event, context):
              try:
                  logger.info(f"Event: {json.dumps(event)}")
                  return {'statusCode': 200, 'body': json.dumps({'message': 'OK'})}
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          AGENT_ID: PLACEHOLDER_AGENT_ID
          AGENT_ALIAS_ID: PLACEHOLDER_AGENT_ALIAS_ID
          SITES_TABLE: !Ref SitesTable
      Timeout: 60
      MemorySize: 512
      TracingConfig:
        Mode: Active

  # ==================== DB Search Lambda ====================
  
  DBSearchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: troubleshooting-db-search
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: app.lambda_handler
      Code:
        ZipFile: |
          import json
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event, context):
              try:
                  logger.info(f"Event: {json.dumps(event)}")
                  return {'statusCode': 200, 'body': json.dumps({'message': 'OK'})}
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}
      Environment:
        Variables:
          SITES_TABLE: !Ref SitesTable
      Timeout: 60
      MemorySize: 512
      TracingConfig:
        Mode: Active

  # ==================== KB Search1 Lambda ====================
  
  KBSearch1Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: troubleshooting-kb-search1
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: app.lambda_handler
      Code:
        ZipFile: |
          import json
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event, context):
              try:
                  logger.info(f"Event: {json.dumps(event)}")
                  return {'statusCode': 200, 'body': json.dumps({'message': 'OK'})}
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}
      Environment:
        Variables:
          KB_ID: PLACEHOLDER_KB_ID
      Timeout: 60
      MemorySize: 512
      TracingConfig:
        Mode: Active

  # ==================== KB Search2 Lambda ====================
  
  KBSearch2Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: troubleshooting-kb-search2
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: app.lambda_handler
      Code:
        ZipFile: |
          import json
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def lambda_handler(event, context):
              try:
                  logger.info(f"Event: {json.dumps(event)}")
                  return {'statusCode': 200, 'body': json.dumps({'message': 'OK'})}
              except Exception as e:
                  logger.error(f"Error: {str(e)}")
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}
      Environment:
        Variables:
          KB_ID: PLACEHOLDER_KB_ID
      Timeout: 60
      MemorySize: 512
      TracingConfig:
        Mode: Active

