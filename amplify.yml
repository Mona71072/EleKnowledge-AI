version: 1

# Amplifyビルド設定ファイル
# モノレポ構成でfrontend/ディレクトリをホストする場合の設定

frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing dependencies..."
        - cd frontend && npm install
        - echo "Setting up environment variables..."
    build:
      commands:
        - echo "Building Next.js application..."
        - npm run build
    postBuild:
      commands:
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: frontend/out
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*

redirects:
  - source: '</^[^.]+$|\.(?!js$|css$|ico$|png$|jpg$|jpeg$|svg$|gif$|webp$)(?:[^.]+)$/>'
    status: 200
    target: '/index.html'

env:
  variables:
    NODE_ENV: production
    NEXT_PUBLIC_AWS_REGION: ap-northeast-1
    # dev 環境の値（2026-07-21 設定。phase1/phase2/troubleshooting-dev スタック出力より）
    # NEXT_PUBLIC_* は元々クライアントバンドルに露出する非機密値。
    NEXT_PUBLIC_API_URL: "https://mqsyka1v9j.execute-api.ap-northeast-1.amazonaws.com/dev"
    NEXT_PUBLIC_RAG_API_URL: "https://lwi9g3kzik.execute-api.ap-northeast-1.amazonaws.com/dev"
    NEXT_PUBLIC_CHAT_API_URL: "https://92pdw6k1o4.execute-api.ap-northeast-1.amazonaws.com/dev"
    NEXT_PUBLIC_TROUBLESHOOTING_API_URL: "https://zh4kbz8bb1.execute-api.ap-northeast-1.amazonaws.com/dev/troubleshooting"
    # Announcements & monitoring API (announcements-monitoring-dev スタック出力 AppApiUrl より設定)
    NEXT_PUBLIC_APP_API_URL: "https://0q3vewys59.execute-api.ap-northeast-1.amazonaws.com/dev"
    NEXT_PUBLIC_ADMIN_GROUP: "admin"
    NEXT_PUBLIC_COGNITO_USER_POOL_ID: "ap-northeast-1_DN17ekXik"
    NEXT_PUBLIC_COGNITO_CLIENT_ID: "doa4arfmc7shs8u0mb91u70mq"
