version: 1

# Amplifyビルド設定ファイル
# モノレポ構成でfrontend/ディレクトリをホストする場合の設定

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - echo "Installing dependencies..."
        - cd frontend && npm ci --include=dev
        - echo "Setting up environment variables..."
    build:
      commands:
        - echo "Building Next.js application..."
        # itaiブランチ限定: 下の env.variables はブランチ環境変数より優先されるため（2026-10-22 実査）、
        # ブランチ変数にRAG/Chat/Researchの各専用API URLが設定されたときだけ配信先を差し替える。
        # 他ブランチ・research URL未設定時はじっくりモードを表示しない。
        - |
          if [ "$AWS_BRANCH" = "itai" ]; then
            case "$ITAI_RAG_API_URL|$ITAI_CHAT_API_URL|$ITAI_RESEARCH_API_URL" in
              https://*\|https://*\|https://*)
                export NEXT_PUBLIC_RAG_API_URL="$ITAI_RAG_API_URL" NEXT_PUBLIC_CHAT_API_URL="$ITAI_CHAT_API_URL" NEXT_PUBLIC_RESEARCH_API_URL="$ITAI_RESEARCH_API_URL" NEXT_PUBLIC_RESEARCH_MODE="beta"
                echo "itai: RAG/Chat/Research APIs overridden by branch variables" ;;
            esac
          fi
          npm run build
    postBuild:
      commands:
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: frontend/out
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*

redirects:
  - source: '</^[^.]+$|\.(?!js$|css$|ico$|png$|jpg$|jpeg$|svg$|gif$|webp$)(?:[^.]+)$/>'
    status: 200
    target: '/index.html'

env:
  variables:
    NODE_ENV: production
    NEXT_PUBLIC_AWS_REGION: ap-northeast-1
    # dev 環境の値（2026-07-21 設定。phase1/phase2/troubleshooting-dev スタック出力より）
    # NEXT_PUBLIC_* は元々クライアントバンドルに露出する非機密値。
    NEXT_PUBLIC_API_URL: "https://mqsyka1v9j.execute-api.ap-northeast-1.amazonaws.com/dev"
    NEXT_PUBLIC_RAG_API_URL: "https://lwi9g3kzik.execute-api.ap-northeast-1.amazonaws.com/dev"
    NEXT_PUBLIC_RESEARCH_MODE: "off"
    NEXT_PUBLIC_LAW_RAG_ENABLED: "true"
    # dev配信で管理者用の先輩チャットを表示する。NEXT_PUBLIC_* はビルド時に固定される。
    NEXT_PUBLIC_ENABLE_KNOWLEDGE_WORKBENCH: "true"
    NEXT_PUBLIC_CHAT_API_URL: "https://92pdw6k1o4.execute-api.ap-northeast-1.amazonaws.com/dev"
    NEXT_PUBLIC_TROUBLESHOOTING_API_URL: "https://zh4kbz8bb1.execute-api.ap-northeast-1.amazonaws.com/dev/troubleshooting"
    # Announcements & monitoring API (announcements-monitoring-dev スタック出力 AppApiUrl より設定)
    NEXT_PUBLIC_APP_API_URL: "https://0q3vewys59.execute-api.ap-northeast-1.amazonaws.com/dev"
    NEXT_PUBLIC_ADMIN_GROUP: "admin"
    NEXT_PUBLIC_COGNITO_USER_POOL_ID: "ap-northeast-1_DN17ekXik"
    NEXT_PUBLIC_COGNITO_CLIENT_ID: "doa4arfmc7shs8u0mb91u70mq"
