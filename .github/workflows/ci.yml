name: CI

on:
  pull_request:
  # マージ後の develop も検証する（個別PRが緑でも、組み合わせで壊れる事故の検出用）
  push:
    branches:
      - develop

# CI はコードを読むだけ。書き込み権限は与えない
permissions:
  contents: read

# 同じ PR への連続 push で古い実行をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Lambda ランタイム（SAM テンプレートの Runtime: python3.13）に合わせる
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/unit/requirements-test.txt
      - name: Install unit test dependencies
        run: pip install -r tests/unit/requirements-test.txt
      - name: Install pinned CloudFormation template linter
        run: pip install cfn-lint==1.46.0
      - name: Lint SAM templates with documented schema exceptions
        run: python scripts/validation/lint_sam_templates.py
      - name: Run unit tests
        env:
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_REGION: ap-northeast-1
        run: python -m pytest tests/unit -q
      - name: Run DynamoDB integration tests with synthetic data
        env:
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_REGION: ap-northeast-1
        run: python -m pytest tests/integration -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for local synthetic browser flow
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end flow against synthetic APIs
        working-directory: frontend
        run: npm run test:e2e:local
      # 全カードが索引生成と同じ検証を通ることを確認する（承認一覧は不要・何も書き出さない）。
      - name: Check every knowledge card builds
        run: node scripts/knowledge/build-senpai-index.mjs check .
      # YAML解析・React描画を使うテストも含むため、依存導入後に実行する。
      - name: Run frontend logic tests
        working-directory: frontend
        run: npm test
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Verify Next lint dependency compatibility
        working-directory: frontend
        run: npm run test:lint-dependencies
      - name: Audit all dependencies for high and critical vulnerabilities
        working-directory: frontend
        run: npm run audit:all
      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Audit production dependencies
        working-directory: frontend
        run: npm run audit:production
      - name: Build frontend
        working-directory: frontend
        run: npm run build
